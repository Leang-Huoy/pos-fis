<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធគ្រប់គ្រង POS និងសាលារៀន</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }
        h2 {
            color: #1e293b;
            margin-bottom: 8px;
        }
        p {
            color: #64748b;
            font-size: 15px;
            margin-bottom: 25px;
        }
        .btn {
            display: inline-block;
            background-color: #ff4b4b;
            color: white;
            padding: 14px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #e03838;
        }
        .info {
            margin-top: 25px;
            padding: 12px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 13px;
            color: #475569;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>🛒 ប្រព័ន្ធ POS និងសាលារៀន</h2>
        <p>សូមចុចប៊ូតុងខាងក្រោមដើម្បីបើកផ្ទាំង Login ចូលប្រើប្រព័ន្ធ</p>
        <a class="btn" href="http://localhost:8501" target="_blank">👉 ចូលប្រើប្រព័ន្ធ (Login)</a>
        
        <div class="info">
            <strong>ព័ត៌មានគណនីលំនាំដើម៖</strong><br>
            • ឈ្មោះគណនី (Username): <code>admin</code><br>
            • ពាក្យសម្ងាត់ (Password): <code>admin123</code>
        </div>
    </div>
</body>
</html>
